<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verify Certificate · Outlier LATAM Coders</title>
<style>
  :root {
    --navy:       #0B1B47;
    --navy-text:  #1A2A5C;
    --blue:       #4A6FBD;
    --blue-light: #9EB8E8;
    --bg:         #F0F4FC;
    --text-body:  #3D4866;
    --subtle:     #7A8499;
    --rule:       #C8D4EC;
    --green:      #1F7A4D;
    --green-bg:   #ECF8F1;
    --red:        #B91C1C;
    --red-bg:     #FEF2F2;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Helvetica, Arial, sans-serif;
    color: var(--navy-text);
    background: var(--bg);
    line-height: 1.5;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 24px 64px; }
  header {
    background: var(--navy);
    color: #fff;
    padding: 18px 24px;
    margin: 0 -24px 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand   { font-weight: 800; font-size: 24px; letter-spacing: -0.5px; }
  .program {
    color: var(--blue-light);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  h1 {
    font-family: 'Playfair Display', Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 36px;
    margin: 0 0 8px;
    color: var(--navy-text);
  }
  .lead { color: var(--text-body); margin: 0 0 28px; }
  .form { display: flex; gap: 8px; margin-bottom: 28px; }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    font-size: 15px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    text-transform: uppercase;
    background: #fff;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(74, 111, 189, 0.18);
  }
  button {
    padding: 12px 22px;
    background: var(--navy);
    color: #fff;
    border: 0;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover    { background: #06143A; }
  button:disabled { opacity: 0.6; cursor: progress; }
  .result {
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 24px;
    margin-bottom: 16px;
    background: #fff;
  }
  .result.ok   { border-color: var(--green); background: var(--green-bg); }
  .result.bad  { border-color: var(--red);   background: var(--red-bg); }
  .result.idle { border-style: dashed; color: var(--subtle); text-align: center; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 12px;
  }
  .ok  .badge { color: var(--green); }
  .bad .badge { color: var(--red); }
  .field {
    display: grid; grid-template-columns: 140px 1fr;
    gap: 8px; padding: 8px 0;
    border-top: 1px solid var(--rule); font-size: 14px;
  }
  .field:first-of-type { border-top: 0; }
  .field .k { color: var(--subtle); }
  .field .v { color: var(--navy-text); font-weight: 500; }
  .recipient {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    font-size: 26px;
    margin: 8px 0 18px;
    color: var(--navy-text);
  }
  footer {
    margin-top: 48px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
    color: var(--subtle);
    font-size: 12px;
    text-align: center;
  }
  @media (max-width: 480px) {
    .form { flex-direction: column; }
    .field { grid-template-columns: 1fr; gap: 2px; }
    .field .k { font-size: 12px; }
    h1 { font-size: 28px; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital@0;1&display=swap">
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">Outlier</span>
    <span class="program">LATAM Coders</span>
  </header>

  <h1>Certificate Verification</h1>
  <p class="lead">
    Enter the code printed on the certificate (or scan its QR code) to confirm
    its authenticity. Records are end-to-end encrypted &mdash; only a valid
    code can decrypt the corresponding entry.
  </p>

  <div class="form">
    <input id="codeInput" type="text" placeholder="OL-XXXXXXXX"
           autocomplete="off" autocapitalize="characters" />
    <button id="checkBtn">Verify</button>
  </div>

  <div id="result" class="result idle">Awaiting a code…</div>

  <footer>
    Issued by Outlier &middot; LATAM Coders Program
  </footer>
</div>

<script>
(() => {
  const DATA_URL = "verifications.json";
  let DATA = null;

  const enc = new TextEncoder();
  const dec = new TextDecoder();

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function bytesToHex(buf) {
    return Array.from(new Uint8Array(buf))
      .map(b => b.toString(16).padStart(2, "0")).join("");
  }
  async function sha256Hex(text) {
    const buf = await crypto.subtle.digest("SHA-256", enc.encode(text));
    return bytesToHex(buf);
  }

  async function loadData() {
    if (DATA) return DATA;
    const res = await fetch(DATA_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    DATA = await res.json();
    return DATA;
  }

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }
  function fmtDate(iso) {
    const d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return iso;
    return d.toLocaleDateString("en-US",
      { year:"numeric", month:"long", day:"numeric" });
  }

  async function decryptRecord(code, record, kdfParams) {
    const salt = b64ToBytes(record.s);
    const nonce = b64ToBytes(record.n);
    const ciphertext = b64ToBytes(record.c);
    const baseKey = await crypto.subtle.importKey(
      "raw", enc.encode(code), "PBKDF2", false, ["deriveKey"]
    );
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: kdfParams.iterations, hash: kdfParams.hash },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false, ["decrypt"]
    );
    const plaintext = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: nonce }, key, ciphertext
    );
    return JSON.parse(dec.decode(plaintext));
  }

  function render(state) {
    const el = document.getElementById("result");
    if (state.kind === "idle") {
      el.className = "result idle";
      el.textContent = "Awaiting a code…";
    } else if (state.kind === "loading") {
      el.className = "result idle";
      el.textContent = "Verifying…";
    } else if (state.kind === "ok") {
      const r = state.record;
      const session = r.session_type || "session";
      el.className = "result ok";
      el.innerHTML = `
        <div class="badge">✓ Verified</div>
        <div class="recipient">${escapeHTML(r.full_name)}</div>
        <div class="field"><span class="k">Title</span>
          <span class="v">${escapeHTML(r.training)}</span></div>
        <div class="field"><span class="k">Type</span>
          <span class="v">${escapeHTML(r.duration_hours)}-hour ${escapeHTML(session)}</span></div>
        <div class="field"><span class="k">Date held</span>
          <span class="v">${escapeHTML(fmtDate(r.date))}</span></div>
        <div class="field"><span class="k">Issued</span>
          <span class="v">${escapeHTML(fmtDate(r.issued))}</span></div>
        <div class="field"><span class="k">Verification code</span>
          <span class="v" style="font-family:ui-monospace,monospace">
            ${escapeHTML(r.verification_code)}</span></div>
      `;
    } else {
      el.className = "result bad";
      el.innerHTML = `
        <div class="badge">✗ Not found</div>
        <div>The code <code>${escapeHTML(state.code)}</code> does not match
        any certificate on record. Check that you've typed it correctly,
        including the <strong>OL-</strong> prefix.</div>
      `;
    }
  }

  async function check(rawCode) {
    const code = (rawCode || "").trim().toUpperCase();
    if (!code) { render({ kind: "idle" }); return; }

    const btn = document.getElementById("checkBtn");
    btn.disabled = true;
    render({ kind: "loading" });

    try {
      const data = await loadData();
      const codeHash = (await sha256Hex(code)).slice(0, 16);
      const candidates = data.records.filter(r => r.h === codeHash);
      for (const cand of candidates) {
        try {
          const record = await decryptRecord(code, cand, data.kdf);
          render({ kind: "ok", record });
          return;
        } catch (_) { /* hash collision; try next */ }
      }
      render({ kind: "bad", code });
    } catch (err) {
      console.error(err);
      render({ kind: "bad", code });
    } finally {
      btn.disabled = false;
    }
  }

  const input = document.getElementById("codeInput");
  document.getElementById("checkBtn").addEventListener("click",
    () => check(input.value));
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") check(input.value);
  });

  // Auto-verify if URL has ?code=XXX (this is what the QR codes encode)
  const params = new URLSearchParams(window.location.search);
  const urlCode = params.get("code");
  if (urlCode) {
    input.value = urlCode.toUpperCase();
    check(urlCode);
  }
})();
</script>
</body>
</html>
